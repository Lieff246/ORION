<!doctype html>
<html>
  <head>
    <style>
      body {
        background-color: lightblue; /* default (desktop) */
      }

      /* Tablet */
      @media (max-width: 768px) {
        body {
          background-color: lightgreen;
        }
      }

      /* HP */
      @media (max-width: 600px) {
        body {
          background-color: lightcoral;
        }
      }
    </style>
  </head>
  <body>
    <h1>Resize layar untuk lihat perubahan warna</h1>
  </body>
</html>
