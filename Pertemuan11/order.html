<!doctype html>
<html>
  <head>
    <style>
      .container {
        display: flex;
      }

      .item {
        padding: 20px;
        background-color: lightblue;
        margin: 5px;
      }

      /* Mengatur urutan */
      .item1 {
        flex-basis: 100px;
      }
      .item2 {
        flex-basis: 200px;
      }
      .item3 {
        flex-basis: 300px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item item1">Item 1</div>
      <div class="item item2">Item 2</div>
      <div class="item item3">Item 3</div>
    </div>
  </body>
</html>
